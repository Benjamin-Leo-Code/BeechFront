<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Weatherboard stripes for the walls and gable -->
    <pattern id="boards" width="4" height="5" patternUnits="userSpaceOnUse" y="1">
      <rect width="4" height="2.5" fill="#f6faf3"/>
      <rect y="2.5" width="4" height="2.5" fill="#9cc98e"/>
    </pattern>
    <!-- Vertical planks for the door -->
    <pattern id="planks" width="4" height="4" patternUnits="userSpaceOnUse" x="25.5">
      <rect width="2" height="4" fill="#9cc98e"/>
      <rect x="2" width="2" height="4" fill="#f6faf3"/>
    </pattern>
  </defs>
  <rect width="64" height="64" rx="14" fill="#2f5d3a"/>
  <!-- Hut body: walls + gable in one striped shape -->
  <path d="M17.5 51V26.5L32 15.5l14.5 11V51Z" fill="url(#boards)"/>
  <!-- Corner posts -->
  <path d="M17.5 26.5V51M46.5 26.5V51" stroke="#f6faf3" stroke-width="1.8"/>
  <!-- Door -->
  <rect x="25.5" y="27.5" width="13" height="23.5" fill="url(#planks)"/>
  <path d="M25.5 51V27.5h13V51" fill="none" stroke="#1e4027" stroke-width="1.3" stroke-linejoin="round"/>
  <!-- Strap hinges and latch -->
  <path d="M24.4 31.5h7M24.4 46.5h7" stroke="#1e4027" stroke-width="1.6" stroke-linecap="round"/>
  <rect x="35" y="37.2" width="1.8" height="3.6" rx="0.6" fill="#1e4027"/>
  <!-- Roof with overhang -->
  <path d="M12.5 29 32 13.5 51.5 29" fill="none" stroke="#f6faf3" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Base and sand -->
  <rect x="15.5" y="50.5" width="33" height="3" rx="1" fill="#1e4027"/>
  <path d="M9 56.5h46" stroke="#cfe3c4" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
</svg>
