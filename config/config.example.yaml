# BeechFront configuration
# Copy to /mnt/user/appdata/beechfront/config.yaml (mounted at /config in the container).
# Any value can pull from an environment variable with ${NAME} or ${NAME:-default},
# so secrets can live in the Unraid container template instead of this file.

title: Beech
subtitle: Home console

auth:
  # Strongly recommended – the console can stop containers and unlock doors.
  password: ${BEECHFRONT_PASSWORD}
  sessionDays: 30

# Unraid 7.x built-in API.
# Create a key: Settings → Management Access → API Keys (role: admin, or read + docker/vm update).
unraid:
  url: http://192.168.1.10          # how the container reaches Unraid
  webUrl: http://tower.local        # optional: link you click to open the Unraid UI
  apiKey: ${UNRAID_API_KEY}

# Container control via the Docker socket (mount /var/run/docker.sock into the container).
docker:
  socket: /var/run/docker.sock
  hostAddress: 192.168.1.10         # used to turn Unraid "WebUI" templates into real links
  favourites: [plex, immich, paperless-ngx]   # shown in Quick launch on the overview
  hide: []                          # containers to leave out entirely
  urls:                             # override a container's link (e.g. use your reverse proxy)
    # vaultwarden: https://vault.example.co.uk

# Home Assistant (running as the HAOS VM).
# Create a token: your profile (bottom-left) → Security → Long-lived access tokens.
homeassistant:
  url: http://192.168.1.11:8123
  token: ${HA_TOKEN}
  vmName: Home Assistant            # name of the VM in Unraid, so the overview can flag it if it stops
  lowBattery: 20                    # % at which battery sensors are flagged
  hide:                             # entity ids to ignore; trailing * is a prefix match
    - sensor.sun_*

# UniFi Network Integration API (Network 9+).
# Create a key: UniFi Network → Settings → Control Plane → Integrations.
unifi:
  url: https://192.168.1.1          # your UniFi gateway / console
  apiKey: ${UNIFI_API_KEY}
  site: default
  # Self-hosted UniFi Network Application? Point url at it (e.g. https://192.168.1.10:8443).
  # apiBase: /proxy/network/integration/v1

# Bookmarks, grouped. `icon` is a name from https://dashboardicons.com (e.g. plex, unraid)
# or a full image URL. Each link is health-checked unless `check: false`;
# `check` can also be a different URL to probe. `pinned: true` adds it to Quick launch.
links:
  - name: Infrastructure
    items:
      - name: Unraid
        url: http://tower.local
        icon: unraid
        pinned: true
      - name: Home Assistant
        url: http://homeassistant.local:8123
        icon: home-assistant
        pinned: true
      - name: UniFi
        url: https://192.168.1.1
        icon: unifi
        pinned: true
  - name: Household
    items:
      - name: Bin collections
        url: https://www.gov.uk/rubbish-collection-day
        check: false
